[project]
name = "job-agent"
version = "0.1.0"
description = "Pulls postings from company ATS boards, scores them against your profile with Claude, and emails a triaged digest."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.109.1",
    "requests>=2.32.0",
]

[project.scripts]
jobagent-fetch = "job_agent.fetch:main"
jobagent-score = "job_agent.score:main"
jobagent-digest = "job_agent.digest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
