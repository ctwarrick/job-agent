[project]
name = "job-agent"
version = "2.4.1"
description = "Pulls postings from company ATS boards, scores them against your profile with Claude, and emails a triaged digest."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.109.1",
    "beautifulsoup4>=4.12",
    "black>=26.5.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.0",
]

[project.scripts]
jobagent-fetch = "job_agent.fetch:_cli"
jobagent-score = "job_agent.score:_cli"
jobagent-digest = "job_agent.digest:_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.black]
line-length = 100
